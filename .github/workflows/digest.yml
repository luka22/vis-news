name: Daily Vis News Digest

on:
  schedule:
    # Daily 05:00 UTC (07:00 CEST / 06:00 CET)
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      skip_scrape:
        description: 'Skip scraping — just redeploy existing docs/'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Restore seen.db cache
        if: ${{ !inputs.skip_scrape }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/seen.db
          key: seen-db-${{ github.run_id }}
          restore-keys: seen-db-

      - name: Install dependencies
        if: ${{ !inputs.skip_scrape }}
        run: pip install -r requirements.txt

      - name: Backfill missing English titles
        if: ${{ !inputs.skip_scrape }}
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/backfill_titles.py

      - name: Run aggregator
        id: aggregate
        if: ${{ !inputs.skip_scrape }}
        # Deploy whatever was rendered even if summarization partly failed;
        # the final step still fails the job so it gets noticed.
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
        run: python main.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./docs

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Fail if aggregator failed
        if: ${{ steps.aggregate.outcome == 'failure' }}
        run: exit 1
